<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WhatsApp Test Signup</title>
</head>
<body>
  <button id="signup">Connect WhatsApp Business app</button>
  <pre id="log"></pre>

  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    const log = (msg) =>
      (document.getElementById('log').textContent += msg + '\n');

    window.fbAsyncInit = function () {
      FB.init({
        appId: '1822368168937490',
        autoLogAppEvents: true,
        xfbml: true,
        version: 'v26.0'
      });
    };

    // Progress events from Meta's signup window
    window.addEventListener('message', (event) => {
      if (!event.origin.endsWith('facebook.com')) return;
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'WA_EMBEDDED_SIGNUP') {
          log('Session event: ' + JSON.stringify(data));
        }
      } catch (e) {}
    });

    // Runs when the signup window closes
    const fbLoginCallback = (response) => {
      if (response.authResponse && response.authResponse.code) {
        log('Signup finished. Code received.');
        // Exchange this code for a token on your server, never in the browser.
      } else {
        log('Signup cancelled or failed: ' + JSON.stringify(response));
      }
    };

    const launchWhatsAppSignup = () => {
      FB.login(fbLoginCallback, {
        config_id: '1602609164261603',
        response_type: 'code',
        override_default_response_type: true,
        extras: { version: 'v4' }
      });
    };

    document
      .getElementById('signup')
      .addEventListener('click', launchWhatsAppSignup);
  </script>
</body>
</html>
